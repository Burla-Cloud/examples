name: Deploy example sites

on:
  # Generated site data is stored outside Git. Restore it before deploying.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify generated site data
        run: |
          required_files=(
            airbnb-burla-demo/site/data/homepage_stats.json
            amazon-review-distiller/data/index.json
            arxiv-fossils/arxiv_fossils_out/extinct.html
            github-repo-summarizer/data/index.json
            hospital-price-reality-check/site/data/code_summary.json
            met-weirdest-art/met_weirdest_out/twins.html
            nyc-ghost-neighborhoods/nyc_ghost_out/index.html
            world-photo-index/data/index.json
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error::Restore generated site artifact: $file"
              exit 1
            }
          done

      - name: Build Pages artifact
        run: |
          set -euo pipefail

          mkdir -p public
          touch public/.nojekyll
          cp index.html public/index.html

          mkdir -p public/airbnb-burla-demo
          cp -R airbnb-burla-demo/site/. public/airbnb-burla-demo/
          mkdir -p public/kentucky-derby-demo
          cp -R kentucky-derby-demo/docs/. public/kentucky-derby-demo/
          mkdir -p public/amazon-review-distiller
          cp -R amazon-review-distiller/. public/amazon-review-distiller/
          mkdir -p public/met-weirdest-art
          cp -R met-weirdest-art/. public/met-weirdest-art/
          mkdir -p public/nyc-ghost-neighborhoods
          cp -R nyc-ghost-neighborhoods/. public/nyc-ghost-neighborhoods/
          mkdir -p public/arxiv-fossils
          cp -R arxiv-fossils/. public/arxiv-fossils/
          mkdir -p public/world-photo-index
          cp -R world-photo-index/. public/world-photo-index/
          mkdir -p public/github-repo-summarizer
          cp -R github-repo-summarizer/. public/github-repo-summarizer/
          mkdir -p public/hospital-price-reality-check
          cp -R hospital-price-reality-check/site/. public/hospital-price-reality-check/

          find public -name .gitignore -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
