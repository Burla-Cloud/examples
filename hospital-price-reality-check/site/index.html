    <title>Hospital Price Reality Check</title>
    <script>
      // SPA fallback for GitHub Pages sub-directory deploys. If a visitor lands
      // on a deep link like /examples/hospital-price-reality-check/hospitals,
      // GitHub serves index.html (or 404.html, identical) without that path on
      // disk. We use a HashRouter, so before React boots we rewrite any
      // post-base path segments into the URL fragment that the router reads.
      (function () {
        try {
          var base = "/examples/hospital-price-reality-check/";
          var path = window.location.pathname;
          if (path.indexOf(base) === 0 && path.length > base.length) {
            var route = "/" + path.slice(base.length) + window.location.search;
            window.history.replaceState(null, "", base + "#" + route);
          }
        } catch (e) {}
      })();
    </script>
